[project]
name = "kv-dreaming"
version = "0.1.0"
description = "Continuous generation from synthetic KV state with bounded memory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1+cpu",
  "transformers==4.55.2",
  "safetensors>=0.4.3",
]

[project.scripts]
kv-dream = "kv_dreaming.cli:main"

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: bounded check using the pinned pretrained checkpoint"]

